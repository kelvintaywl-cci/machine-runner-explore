version: 2.1

executors:
  ubuntu2004:
    machine: true
    resource_class: kelvintaywl-cci/lightsail-medium-ubuntu-2004
  ubuntu2204:
    machine: true
    resource_class: kelvintaywl-cci/lightsail-medium-ubuntu-2204
  base:
    docker:
      - image: cimg/base:current
    resource_class: small
jobs:
  sleep:
    parameters:
      exec:
        type: executor
      wait:
        type: integer
        default: 30
    executor: << parameters.exec >>
    steps:
      - run: sleep << parameters.wait >>
      - run: echo done

workflows:
  ubuntu2004:
    jobs:
      - sleep:
          matrix:
            parameters:
              exec:
                - ubuntu2004
  ubuntu2204:
    jobs:
      - sleep:
          name: gatekeep
          exec: base
          wait: 5
      - sleep:
          matrix:
            parameters:
              exec:
                - ubuntu2204
