version: 2.1

executors:
  machine3-linux:
    machine: true
    resource_class: kelvintaywl-cci/lightsail-medium-throwaway

jobs:
  foo:
    executor: machine3-linux
    steps:
      - run: whoami
      - run: printenv PATH
      - run: docker version
      - run: goenv version
      - run: goenv install -s 1.12.0
      - run: goenv global 1.12.0
      - run: goenv rehash


workflows:
  main:
    jobs:
      - foo:
          context:
            - foo-2
